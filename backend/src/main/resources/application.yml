server:
  port: 8080

spring:
  application:
    name: rem-registry
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rem_registry}
    username: ${DB_USER:rem}
    password: ${DB_PASSWORD:rempass}
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [correlationId:%X{correlationId}] %logger{36} - %msg%n"
